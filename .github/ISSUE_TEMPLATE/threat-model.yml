name: Threat model review
description: Record a trust-boundary, abuse-case, or security design review.
title: "Threat model: "
body:
  - type: markdown
    attributes:
      value: |
        This public form is only for non-sensitive design review. Do not disclose an undisclosed
        vulnerability, exploit path, private topology, credentials, Task data, Device Knowledge,
        or diagnostic evidence here. Report suspected vulnerabilities through GitHub's private
        form: https://github.com/jugol/OpenDelegate/security/advisories/new

  - type: checkboxes
    id: disclosure_safety
    attributes:
      label: Public disclosure safety
      options:
        - label:
            This is a non-sensitive design review and contains no undisclosed vulnerability, exploit
            details, credentials, private topology, Task data, or Device Knowledge.
          required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and assets
      description:
        Identify the component, data, credentials, identities, and external systems in scope.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Trust boundaries and actors
      description: Describe authority changes, untrusted inputs, and communication boundaries.
    validations:
      required: true
  - type: textarea
    id: threats
    attributes:
      label: Threats and attack paths
      description:
        Include misuse, compromise, replay, escalation, disclosure, and availability risks.
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: Controls and residual risk
      description: Separate deterministic controls from agent guidance and state remaining risk.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Negative tests and evidence
      description: List the denial, bypass, restart, and adversarial cases that must pass.
    validations:
      required: true
