name: Private security channel request
description: Request a private reporting route without disclosing vulnerability details.
title: "security: private reporting channel requested"
body:
  - type: markdown
    attributes:
      value: |
        Use this form only because OpenDelegate does not yet publish a private security route.
        Do not include vulnerability details, affected identifiers, diagnostics, screenshots,
        reproduction steps, credentials, Secret values, private Task data, native Agent Session
        data, or Device Knowledge.

        The maintainer must establish a private path before asking you for any technical details.

  - type: checkboxes
    id: disclosure_safety
    attributes:
      label: Disclosure safety
      options:
        - label:
            I am requesting a private reporting channel and have included no vulnerability or
            exploit details in this public issue.
          required: true
