name: Architecture decision
description: Propose an ADR before changing an accepted product or architecture decision.
title: "ADR: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form when implementation evidence may require a change to an accepted decision.
        Review `CONTEXT.md`, the product specification, implementation plan, and decision log first.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What implementation evidence or constraint requires a decision?
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision
      description: State the decision and its scope precisely.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include the status quo and explain why each alternative was rejected.
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Invariant and security impact
      description: Identify affected non-negotiable invariants, trust boundaries, and failure modes.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Required proof
      description: List tests or operational evidence needed before accepting the decision.
    validations:
      required: true
  - type: checkboxes
    id: canonical_updates
    attributes:
      label: Canonical document updates
      options:
        - label: I will update the canonical specification and decision log if this ADR is accepted.
          required: true
