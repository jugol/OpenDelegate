name: Product or implementation proposal
description: Propose a focused improvement with explicit contract, platform, and proof impact.
title: "proposal: "
body:
  - type: markdown
    attributes:
      value: |
        Review the README's current-status table before proposing work. OpenDelegate's canonical
        product behavior lives in `CONTEXT.md`, `docs/PRODUCT_SPEC.md`,
        `docs/IMPLEMENTATION_PLAN.md`, and `docs/DECISIONS.md`.

        Use the dedicated Architecture Decision form when implementation evidence may change an
        accepted product or architecture decision. Never include Secret values, private Task data,
        or Device Knowledge metadata or content.

  - type: dropdown
    id: proposal_kind
    attributes:
      label: Proposal type
      options:
        - Product behavior
        - Implementation or architecture
        - Adapter or extension boundary
        - Developer experience, documentation, or CI
        - Other
    validations:
      required: true

  - type: input
    id: phase
    attributes:
      label: Target phase
      description: Identify the implementation-plan phase or say that this is post-milestone work.
      placeholder: "Phase 2, Phase 13, post-first-milestone, or unknown"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete user, contributor, or operational problem.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Observable outcome
      description: State how a user or public contract would demonstrate success.
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: Proposed approach
      description: Outline the smallest coherent change and the boundary that should own it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include the status quo and why the alternatives do not solve the problem.
    validations:
      required: true

  - type: textarea
    id: contract_impact
    attributes:
      label: Canonical contract impact
      description: |
        Name affected non-negotiable invariants, functional requirements, accepted decisions, or
        ADRs. Say "none" and explain when the proposal changes no product behavior.
    validations:
      required: true

  - type: textarea
    id: platform_security_impact
    attributes:
      label: Platform and security impact
      description: |
        Assess macOS, Windows, Linux, Computer Use, Secret, Policy, Device Knowledge, and
        cross-Task isolation implications. Mark an area not applicable only with a short reason.
    validations:
      required: true

  - type: textarea
    id: proof
    attributes:
      label: Required proof
      description: List automated contract tests and any real-platform or manual evidence required.
    validations:
      required: true

  - type: checkboxes
    id: proposal_safety
    attributes:
      label: Scope and disclosure checks
      options:
        - label:
            I distinguished current foundation behavior, first-milestone work, and post-milestone
            scope.
          required: true
        - label:
            I included no credentials, Secret values, private Task data, or Device Knowledge
            metadata or content.
          required: true
