name: Pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: "pull-request-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check repository
        run: pnpm check

      - name: Build applications
        run: pnpm build

      - name: Install browser runner
        run: pnpm --filter @opendelegate/admin-web exec playwright install --with-deps chromium

      - name: Run Admin Web browser harness
        run: pnpm test:browser

      - name: Upload Admin Web browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-web-playwright
          path: ${{ runner.temp }}/opendelegate-playwright-results
          if-no-files-found: ignore
          retention-days: 7
