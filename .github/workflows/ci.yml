name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Node 24 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify canonical planning-document links
        run: pnpm docs:check

      - name: Verify release evidence and architecture boundaries
        run: pnpm release:status && pnpm architecture:check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run acceptance and unit harness
        run: pnpm test

      - name: Build applications
        run: pnpm build

      - name: Smoke an explicitly unsupported platform bundle
        run: >-
          pnpm release:build --destination "${{ runner.temp }}/opendelegate-internal-preview"
          --internal-preview

      - name: Archive manually requested internal preview on macOS or Linux
        if: github.event_name == 'workflow_dispatch' && runner.os != 'Windows'
        run: >-
          tar -C "${{ runner.temp }}" -czf "${{ runner.temp }}/opendelegate-internal-preview-${{
          runner.os }}-${{ runner.arch }}.tar.gz" opendelegate-internal-preview

      - name: Archive manually requested internal preview on Windows
        if: github.event_name == 'workflow_dispatch' && runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive -LiteralPath '${{ runner.temp }}/opendelegate-internal-preview'
          -DestinationPath '${{ runner.temp }}/opendelegate-internal-preview-${{ runner.os }}-${{
          runner.arch }}.zip'

      - name: Upload manually requested internal preview
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opendelegate-internal-preview-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/opendelegate-internal-preview-${{ runner.os }}-${{ runner.arch }}.tar.gz
            ${{ runner.temp }}/opendelegate-internal-preview-${{ runner.os }}-${{ runner.arch }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Install browser runner
        run: pnpm --filter @opendelegate/admin-web exec playwright install --with-deps chromium

      - name: Run Admin Web browser harness
        run: pnpm test:browser

      - name: Upload Admin Web browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: admin-web-playwright-${{ matrix.os }}
          path: ${{ runner.temp }}/opendelegate-playwright-results
          if-no-files-found: ignore
          retention-days: 7

  node-22-compatibility:
    name: Verify temporary Node 22 floor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify compatibility floor
        run: pnpm check

      - name: Build applications
        run: pnpm build

  postgres-integration:
    name: Verify PostgreSQL persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: opendelegate_test
          POSTGRES_PASSWORD: opendelegate_test
          POSTGRES_USER: opendelegate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opendelegate_test -d opendelegate_test" --health-interval 5s
          --health-timeout 5s --health-retries 12

    env:
      OPENDELEGATE_TEST_POSTGRES_URI: postgresql://opendelegate_test:opendelegate_test@127.0.0.1:5432/opendelegate_test

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SQLite and PostgreSQL acceptance contracts
        run: >-
          pnpm --filter @opendelegate/storage-sql test && pnpm --filter @opendelegate/acceptance
          test && pnpm --filter @opendelegate/main test
