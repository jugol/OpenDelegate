name: CodeQL

on:
  schedule:
    - cron: "37 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  analyze-no-build:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            runner: ubuntu-24.04
            build-mode: none
          - language: python
            runner: ubuntu-24.04
            build-mode: none
          - language: actions
            runner: ubuntu-24.04
            build-mode: none

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          build-mode: ${{ matrix.build-mode }}
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze repository
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"

  analyze-c-cpp:
    name: Analyze (c-cpp-${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runner: windows-2025
          - target: linux
            runner: ubuntu-24.04
          # Linux analyzes the shared POSIX service launcher. macOS-specific native
          # sources are Swift and are analyzed once by analyze-swift below.

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          build-mode: manual
          languages: c-cpp
          queries: security-extended

      - name: Build Windows Computer Use sources
        if: matrix.target == 'windows'
        run: node packages/computer-use-os/native/windows/build.mjs

      - name: Build native service host sources
        run: node packages/platform-services/native/service-host/build.mjs

      - name: Analyze repository
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:c-cpp/platform:${{ matrix.target }}"

  analyze-swift:
    name: Analyze (swift)
    runs-on: macos-26
    # Instrumented Swift release builds routinely need 26–30 minutes on
    # hosted macOS runners before CodeQL can upload and finalize the SARIF.
    # Leave enough cleanup headroom so successful analyses are not cancelled.
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          build-mode: manual
          languages: swift
          queries: security-extended

      - name: Build Swift sources
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path packages/computer-use-os/native/macos \
            --scratch-path "${RUNNER_TEMP}/opendelegate-codeql-swift"
          swift build \
            --configuration release \
            --package-path packages/computer-use-os/native/macos \
            --scratch-path "${RUNNER_TEMP}/opendelegate-codeql-swift" \
            --product opendelegate-macos-computer-use
          swift build \
            --configuration release \
            --package-path packages/computer-use-os/native/macos \
            --scratch-path "${RUNNER_TEMP}/opendelegate-codeql-swift" \
            --product opendelegate-computer-use-fixture
          node --input-type=module <<'NODE'
          const { buildMacOsKeychainHelper } = await import(
            "./packages/secrets/native/macos/build.mjs"
          );
          await buildMacOsKeychainHelper({
            outputRoot: `${process.env.RUNNER_TEMP}/opendelegate-codeql-keychain`,
          });
          NODE

      - name: Analyze repository
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:swift"
