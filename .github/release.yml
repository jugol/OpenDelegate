changelog:
  exclude:
    labels:
      - "skip-changelog"
  categories:
    - title: "Breaking changes"
      labels:
        - "breaking-change"
    - title: "Features"
      labels:
        - "feature"
        - "enhancement"
    - title: "Fixes"
      labels:
        - "bug"
        - "fix"
    - title: "Documentation and tooling"
      labels:
        - "documentation"
        - "tooling"
    - title: "Other changes"
      labels:
        - "*"
